# Frozen literature values (ICRP 2002 reference adult male; verify against source
# before S1 and record the edition in theory/decisions/).
# Flow fractions MUST sum to 1.0 — enforced at load.
body_weight_kg: 70.0
cardiac_output_L_per_h: 390.0

blood:
  arterial_L: 0.90
  venous_L: 3.80
  lung_tissue_L: 0.50
  lung_partition: 1.0

organs:
  - {name: adipose,  vol_frac: 0.2100, flow_frac: 0.04, partition: 1.0}
  - {name: bone,     vol_frac: 0.0800, flow_frac: 0.04, partition: 1.0}
  - {name: brain,    vol_frac: 0.0200, flow_frac: 0.12, partition: 1.0}
  - {name: gut,      vol_frac: 0.0170, flow_frac: 0.13, partition: 1.0}
  - {name: heart,    vol_frac: 0.0050, flow_frac: 0.04, partition: 1.0}
  - {name: kidney,   vol_frac: 0.0040, flow_frac: 0.17, partition: 1.0}
  - {name: liver,    vol_frac: 0.0260, flow_frac: 0.22, partition: 1.0}
  - {name: muscle,   vol_frac: 0.4000, flow_frac: 0.15, partition: 1.0}
  - {name: skin,     vol_frac: 0.0370, flow_frac: 0.04, partition: 1.0}
  - {name: spleen,   vol_frac: 0.0026, flow_frac: 0.03, partition: 1.0}
  - {name: pancreas, vol_frac: 0.0014, flow_frac: 0.02, partition: 1.0}
